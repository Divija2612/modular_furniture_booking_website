<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>decorex Furniture Booking</title>

<style>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* BLURRED BACKGROUND */
.bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('decorex.png') no-repeat center/cover;
    filter: blur(8px);              /* BLUR EFFECT */
    z-index: -1;                    /* send it behind content */
}

/* CONTENT */
.container {
    width: 400px;
    margin: auto;
    margin-top: 80px;
    padding: 25px;
    background: rgba(255,255,255,0.9); /* slight transparency */
    border-radius: 10px;
    box-shadow: 0px 0px 15px gray;
    text-align: center;
}

/* CONTAINER */
.container {
    width: 400px;
    margin: auto;
    margin-top: 60px;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 15px gray;
    text-align: center;
    animation: fadeIn 1s ease-in;
}


/* INPUT FIELDS */
input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    background: #6a11cb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #2575fc;
}

/* LINK */
a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
}

/* ANIMATION */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="container">
    <h1>decorex Modular Furniture</h1>
    <h3>Book Your Furniture Now</h3>

    <form action="book.php" method="POST">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="phone" placeholder="Phone Number" required>

        <select name="furniture_type" required>
            <option value="">Select Furniture</option>
            <option>Office furniture</option>
            <option>Dining Table</option>
            <option>Modular Kitchen</option>
            <option>Wardrobe</option>
        </select>

        <input type="date" name="booking_date" required>
        <textarea name="address" placeholder="Delivery Address" required></textarea>

        <button type="submit">Book Now</button>
    </form>
</div>

</body>
</html>
